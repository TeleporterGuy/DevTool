# Generate the Xcode project with:  cd ios && xcodegen generate
# DevTool.xcodeproj is generated and gitignored; edit this file instead.
name: DevTool

options:
  bundleIdPrefix: sk.awantech
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  DevToolKit:
    path: DevToolKit

targets:
  DevTool:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DevTool
    dependencies:
      - package: DevToolKit
    info:
      path: DevTool/Info.plist
      properties:
        CFBundleDisplayName: DevTool
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        NSCameraUsageDescription: DevTool uses the camera to scan the pairing QR code shown on your desktop.
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: sk.awantech.devtool.pair
            CFBundleURLSchemes:
              - devtool
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sk.awantech.devtool
        PRODUCT_NAME: DevTool
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        ENABLE_PREVIEWS: YES
    scheme:
      commandLineArguments:
        # Preloads mock desktops (no relay needed). Untick to use persisted pairings.
        "-mockDesktop": true
